app:
  name: "Python Automation Suite"
  version: "1.0.0"
  environment: "development"

api:
  host: "0.0.0.0"
  port: 8000
  reload: false

automation:
  schedule_interval_minutes: 15
  health_check_urls:
    - name: "GitHub API Status"
      url: "https://api.github.com"
      timeout_seconds: 5
    - name: "HTTPBin Echo Test"
      url: "https://httpbin.org/get"
      timeout_seconds: 5

youtube:
  default_niche: "space"
  output_dir: "output/shorts"
  dry_run_upload: true
  voice:
    name: "en-US-ChristopherNeural"
    rate: "+0%"
    pitch: "+0Hz"
  video:
    width: 1080
    height: 1920
    fps: 30
    subtitle_font_size: 56
    subtitle_color: "yellow"

notifications:
  webhook_url: ""
  notify_on_failure: true

logging:
  level: "INFO"
  format: "rich"