app:
  name: "Python Automation Suite"
  version: "1.0.0"
  environment: "development"

api:
  host: "0.0.0.0"
  port: 8000
  reload: false

automation:
  schedule_interval_minutes: 15
  health_check_urls:
    - name: "GitHub API Status"
      url: "https://api.github.com"
      timeout_seconds: 5
    - name: "HTTPBin Echo Test"
      url: "https://httpbin.org/get"
      timeout_seconds: 5

notifications:
  webhook_url: ""
  notify_on_failure: true

logging:
  level: "INFO"
  format: "rich"